# go to sleep after one hour (1*60*60*1000ms)

CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

CONFIG_ZMK_SLEEP=y

# Turn on logging, and set ZMK logging to debug output
# CONFIG_ZMK_USB_LOGGING=n
#
# Copyright (c) 2022 Darryl deHaan
# SPDX-License-Identifier: MIT
#
# Enable 32kHz crystal
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_30PPM=y

CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=60
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3


#CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

#EC11 enable
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

#EXT POWER
CONFIG_ZMK_EXT_POWER=y

# MOUSE
CONFIG_ZMK_POINTING=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n

CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100
CONFIG_ZMK_BACKLIGHT_ON_START=y
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=n

#缩小数值减少延迟但对轴体品质要求会更高 Reducing the value will decrease the latency, but it will also place higher demands on the switching quality. If you are confident about the quality of the switch used on the keyboard, you can try smaller values, such as 1ms - 3ms.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=8
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=8

#soft off
CONFIG_ZMK_PM_SOFT_OFF=y









# === nice!epaper (zmk-nice-oled module) ===
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_NICE_EPAPER_ON=y
# central (left) widgets
# WPM (输入速率) and the luna dog sprite are off: the freed design y24..123 band
# now carries the 68x100 screen_art image (widgets/screen.c draw_screen_art).
CONFIG_NICE_OLED_WIDGET_WPM=n
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=n
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH=n
CONFIG_NICE_OLED_WIDGET_WPM_SPEEDOMETER=n
CONFIG_NICE_OLED_WIDGET_LAYER=y
# The big profile widget is the default on nice!view, and it paints five 14px
# boxes at a hardcoded y129 (it ignores PROFILE_CUSTOM_Y entirely). That is the
# row widgets/profile.c draws as three stars, so stars -- and the hearts before
# them -- never reached the screen while this stayed at its default.
CONFIG_NICE_OLED_WIDGET_PROFILE_BIG=n
# The modifier indicators are laid out for the 128-wide OLED: on this panel the
# 2x2 grid starts at x62, so its right column falls off the canvas and its left
# one paints a permanent sliver over design x62..67, y62..91 -- straight across
# the right half of the diamond-hole coin and the lower sparkle. There is no
# room to relocate it: the art owns y24..123 and the top and bottom rows are
# full. The character count still repaints because widgets/char_count.c asks
# for it itself rather than borrowing the listener this section used to run.
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=n
# peripheral (right) widgets
# The eight-frame animated cat overlay is off: design y55..123 now carries the
# 68x69 screen_art_peripheral image (widgets/screen_peripheral.c draw_screen_art).
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=n
# === 黑边诊断：临时关掉反转，用白色背景测试边框区域是否还能被驱动 ===
CONFIG_NICE_OLED_WIDGET_INVERTED=y

# legacy rendering params (matches 2026-05-29 build)
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_DPI_DEF=161
