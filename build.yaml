---
include:
  - board: nice_nano_v2
    shield: eyelash_sofle_left nice_epaper
    snippet: studio-rpc-usb-uart zmk-usb-logging
    cmake-args: >-
      -DCONFIG_ZMK_STUDIO=y
      -DCONFIG_ZMK_STUDIO_LOCKING=y
      -DCONFIG_LOG_BUFFER_SIZE=4096
      -DCONFIG_LOG_PROCESS_TRIGGER_THRESHOLD=1
      -DCONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC_UNSECURED=y
      -DCONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=128
      -DCONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
  - board: nice_nano_v2
    shield: eyelash_sofle_right nice_epaper
    cmake-args: -DCONFIG_ZMK_KSCAN_DIAGNOSTICS=n
  - board: nice_nano_v2
    shield: settings_reset
